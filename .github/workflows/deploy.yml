name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Upload site
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          # Ключ из консоли может прийти одной строкой или с лишними пробелами -
          # собираем его заново: заголовок, тело по 70 символов, концовка
          body=$(printf '%s' "$SSH_KEY" | tr -d '\r' \
            | sed -e 's/-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----//' \
            | tr -d ' \t\n')
          {
            echo "-----BEGIN OPENSSH PRIVATE KEY-----"
            printf '%s\n' "$body" | fold -w 70
            echo "-----END OPENSSH PRIVATE KEY-----"
          } > ~/.ssh/site_key
          chmod 600 ~/.ssh/site_key
          ssh-keygen -y -f ~/.ssh/site_key > /dev/null || { echo "SSH_KEY повреждён - скопируй ключ заново"; exit 1; }
          # Маршрут GitHub -> сервер в РФ теряет часть соединений: повторяем,
          # чередуя порты 22 и 2222 (sshd слушает оба), с паузой 20 секунд.
          for i in 1 2 3 4 5 6 7 8; do
            port=$([ $((i % 2)) = 1 ] && echo 22 || echo 2222)
            rsync -az --delete --timeout=60 \
              --exclude '.git*' --exclude '.github' --exclude 'deploy/' --exclude 'README.md' \
              -e "ssh -i $HOME/.ssh/site_key -p $port -o ConnectTimeout=20 -o ServerAliveInterval=15 -o StrictHostKeyChecking=accept-new" \
              ./ "$SSH_USER@$SSH_HOST:/var/www/logispotio.ru/" && { echo "Готово (попытка $i, порт $port)"; exit 0; }
            echo "rsync: попытка $i (порт $port) не удалась, повтор через 20 с"; sleep 20
          done
          exit 1
