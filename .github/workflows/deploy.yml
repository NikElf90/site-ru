name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload site
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          # Ключ из консоли может прийти одной строкой или с лишними пробелами —
          # собираем его заново: заголовок, тело по 70 символов, концовка
          body=$(printf '%s' "$SSH_KEY" | tr -d '\r' \
            | sed -e 's/-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----//' \
            | tr -d ' \t\n')
          {
            echo "-----BEGIN OPENSSH PRIVATE KEY-----"
            printf '%s\n' "$body" | fold -w 70
            echo "-----END OPENSSH PRIVATE KEY-----"
          } > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "SSH_KEY повреждён — скопируй ключ заново"; exit 1; }
          # Соединения из-за рубежа до RU-сервера иногда теряются, поэтому повторяем
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -t ed25519 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            [ -s ~/.ssh/known_hosts ] && break
            echo "ssh-keyscan: попытка $i не удалась, повтор"; sleep 5
          done
          [ -s ~/.ssh/known_hosts ] || { echo "Сервер не ответил на ssh-keyscan"; exit 1; }
          for i in 1 2 3; do
            rsync -az --delete --timeout=60 \
              --exclude '.git*' --exclude '.github' --exclude 'deploy/' --exclude 'README.md' \
              -e "ssh -i $HOME/.ssh/deploy_key -o ConnectTimeout=20 -o ServerAliveInterval=15" \
              ./ "$SSH_USER@$SSH_HOST:/var/www/logispotio.ru/" && exit 0
            echo "rsync: попытка $i не удалась, повтор"; sleep 10
          done
          exit 1
