# /etc/nginx/sites-available/logispotio.ru  →  ln -s в sites-enabled, затем: sudo certbot --nginx -d logispotio.ru -d www.logispotio.ru
server {
    listen 80;
    server_name logispotio.ru www.logispotio.ru;
    root /var/www/logispotio.ru;
    index index.html;
    charset utf-8;

    if ($host = www.logispotio.ru) { return 301 https://logispotio.ru$request_uri; }

    location / { try_files $uri $uri.html $uri/ =404; }
    location ~ /\. { deny all; }

    location ~* \.(png|jpg|jpeg|svg|webp|woff2)$ { expires 30d; add_header Cache-Control "public"; }
    location ~* \.(js|css)$ { expires 7d; add_header Cache-Control "public"; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
